# Lint configuration for CI. ruff is a dev tool only — the plugin runtime stays
# stdlib-only with zero pip dependencies.
line-length = 100
target-version = "py310"

[lint]
# pycodestyle (E4/E7/E9) + pyflakes (F) + bugbear (B): the sets that catch real
# defects without re-litigating style. Deliberately excludes the rewrite/preview
# families, which flag idioms this codebase uses on purpose (`re.I` aliases,
# module-level import stand-ins in tests).
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# The test suites prepend sys.path to import the plugin's degraded-import stand-ins,
# which is the whole point: they import `main`/`build_plugin_zip` before anything else.
"tests/*" = ["E402"]
