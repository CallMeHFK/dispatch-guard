name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      # Pinned to the version the tree is actually linted with locally, so CI
      # and `ruff check .` on a dev box cannot disagree about what a rule means.
      - name: Lint
        run: |
          pip install "ruff==0.16.8"
          ruff check .
      - name: Build the plugin archive
        run: python packaging/build_plugin_zip.py
